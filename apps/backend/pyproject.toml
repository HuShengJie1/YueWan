[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meetup-vote-backend"
version = "0.1.0"
description = "Backend API for the MeetUp Vote WeChat miniprogram"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2.0",
  "asyncmy>=0.2.11,<0.3",
  "cryptography>=44,<50",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "Pillow>=11.1,<13.0",
  "PyJWT>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy[asyncio]>=2.0.38,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
